name: Build FPSBoostOverlay

on:
  push:
    branches:
      - fpsboost-build-20260918
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source archive
        shell: pwsh
        run: |
          $parts = Get-ChildItem "payload/part_*.txt" | Sort-Object Name
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          [IO.File]::WriteAllBytes("FPSBoostOverlay.zip", [Convert]::FromBase64String($b64))
          Expand-Archive -Path "FPSBoostOverlay.zip" -DestinationPath "work" -Force
          if (-not (Test-Path "work/fpsboost/CMakeLists.txt")) { throw "Source archive reconstruction failed." }

      - name: Download Dear ImGui v1.90.9
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "work/fpsboost/third_party" | Out-Null
          Invoke-WebRequest "https://github.com/ocornut/imgui/archive/refs/tags/v1.90.9.zip" -OutFile "imgui.zip"
          Expand-Archive -Path "imgui.zip" -DestinationPath "imgui_tmp" -Force
          Move-Item "imgui_tmp/imgui-1.90.9" "work/fpsboost/third_party/imgui"

      - name: Apply compile fixes
        shell: pwsh
        run: |
          $overlay = "work/fpsboost/src/OverlayWindow.cpp"
          $s = Get-Content $overlay -Raw
          $needle = '#include "imgui_impl_win32.h" // declare ImGui_ImplWin32_WndProcHandler, voir CMakeLists.txt'
          $replacement = $needle + "`r`nextern IMGUI_IMPL_API LRESULT ImGui_ImplWin32_WndProcHandler(HWND hwnd, UINT msg, WPARAM wParam, LPARAM lParam);"
          $s = $s.Replace($needle, $replacement)
          $oldNc = @'
        self = reinterpret_cast<OverlayWindow*>(cs->lpCreateParams);
        SetWindowLongPtrW(hwnd, GWLP_USERDATA, reinterpret_cast<LONG_PTR>(self));
'@
          $newNc = @'
        self = reinterpret_cast<OverlayWindow*>(cs->lpCreateParams);
        SetWindowLongPtrW(hwnd, GWLP_USERDATA, reinterpret_cast<LONG_PTR>(self));
        if (self)
        {
            self->m_hwnd = hwnd;
        }
        return TRUE;
'@
          $s = $s.Replace($oldNc, $newNc)
          Set-Content -Path $overlay -Value $s -Encoding utf8

          $renderer = "work/fpsboost/src/Renderer.cpp"
          $s = Get-Content $renderer -Raw
          $s = $s.Replace('    hr = factory->CreateSwapChainForComposition(', '    ComPtr<IDXGISwapChain1> swapChain1;' + "`r`n`r`n" + '    hr = factory->CreateSwapChainForComposition(')
          $s = $s.Replace('&m_swapChain', '&swapChain1')
          if (-not $s.Contains('m_swapChain = swapChain1;')) { $s = $s.Replace('    return CreateRenderTarget();', '    m_swapChain = swapChain1;' + "`r`n`r`n" + '    return CreateRenderTarget();') }
          Set-Content -Path $renderer -Value $s -Encoding utf8

          $monitor = "work/fpsboost/src/SystemMonitor.cpp"
          $s = Get-Content $monitor -Raw
          $s = $s.Replace('WBEM_FLAG_RETURN_IMMEDIATE', 'WBEM_FLAG_RETURN_IMMEDIATELY')
          Set-Content -Path $monitor -Value $s -Encoding utf8

          $cmake = "work/fpsboost/CMakeLists.txt"
          $s = Get-Content $cmake -Raw
          $s = $s.Replace('target_sources(FPSBoostOverlay PRIVATE cmake/app.manifest)', '# app.manifest embedded after linking by the CI build')
          Set-Content -Path $cmake -Value $s -Encoding utf8

      - name: Configure
        shell: pwsh
        run: cmake -S work/fpsboost -B work/fpsboost/build -G "Visual Studio 17 2022" -A x64

      - name: Build Release
        shell: pwsh
        run: cmake --build work/fpsboost/build --config Release --parallel

      - name: Embed administrator manifest
        shell: pwsh
        run: |
          $mt = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\mt.exe" | Sort-Object FullName | Select-Object -Last 1
          if (-not $mt) { throw "mt.exe not found" }
          & $mt.FullName -nologo -manifest "work/fpsboost/cmake/app.manifest" "-outputresource:work/fpsboost/build/Release/FPSBoostOverlay.exe;#1"
          if ($LASTEXITCODE -ne 0) { throw "Manifest embedding failed" }

      - name: Package
        shell: pwsh
        run: |
          $out = "dist"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item "work/fpsboost/build/Release/FPSBoostOverlay.exe" "$out/FPSBoostOverlay.exe"
          Copy-Item "work/fpsboost/build/Release/shaders" "$out/shaders" -Recurse
          Get-FileHash "$out/FPSBoostOverlay.exe" -Algorithm SHA256 | Format-List

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: FPSBoostOverlay-Windows-x64
          path: dist/
          if-no-files-found: error
