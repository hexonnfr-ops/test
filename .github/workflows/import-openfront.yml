name: Import verified OpenFront baseline

on:
  workflow_dispatch:
  push:
    paths:
      - BOOTSTRAP_OPENFRONT

permissions:
  contents: write

concurrency:
  group: import-openfront-baseline
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'hexonnfr-ops/test'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import verified upstream commit
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM_COMMIT="61789260bbb3bd2e1a0d7e42b4e1f0ceaf61ffe1"
          workdir="$(mktemp -d)"
          git clone --no-tags https://github.com/openfrontio/OpenFrontIO.git "$workdir/upstream"
          git -C "$workdir/upstream" checkout "$UPSTREAM_COMMIT"

          # Copy the verified upstream baseline while preserving the Territory
          # Chaos overlay that was authored independently in this repository.
          # OpenFront proprietary assets are deliberately never imported.
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='/proprietary/' \
            --exclude='/.github/workflows/import-openfront.yml' \
            --exclude='/BOOTSTRAP_OPENFRONT' \
            --exclude='/IMPORT_NOTE.md' \
            --exclude='/README.md' \
            --exclude='/CREDITS.md' \
            --exclude='/IMPLEMENTATION_PLAN.md' \
            --exclude='/DEPLOYMENT.md' \
            --exclude='/.env.example' \
            --exclude='/src/chaos/' \
            --exclude='/src/client/chaos/' \
            --exclude='/src/server/chaos/' \
            --exclude='/tests/chaos/' \
            --exclude='/scripts/applyTerritoryChaosOverlay.mjs' \
            "$workdir/upstream/" ./

          rm -rf proprietary
          printf '%s\n' "$UPSTREAM_COMMIT" > .territory-chaos-imported

      - name: Apply Territory Chaos integration seams
        run: node scripts/applyTerritoryChaosOverlay.mjs

      - name: Refresh dependency lock safely
        run: npm install --package-lock-only --ignore-scripts

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run Territory Chaos tests
        run: npx vitest run tests/chaos

      - name: Lint Territory Chaos modules
        run: npx eslint src/chaos src/client/chaos src/server/chaos tests/chaos

      - name: Commit imported baseline + validated overlay
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "territory-chaos-bot"
          git config user.email "territory-chaos-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "chore: import verified OpenFront baseline and apply Territory Chaos overlay"
          git push origin HEAD:${GITHUB_REF_NAME}
