name: Import verified OpenFront baseline

on:
  push:
    paths:
      - BOOTSTRAP_OPENFRONT
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-openfront-baseline
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'hexonnfr-ops/test'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import verified upstream commit
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM_COMMIT="61789260bbb3bd2e1a0d7e42b4e1f0ceaf61ffe1"
          if [[ -f .territory-chaos-imported ]]; then
            echo "Baseline already imported."
            exit 0
          fi

          workdir="$(mktemp -d)"
          git clone --no-tags https://github.com/openfrontio/OpenFrontIO.git "$workdir/upstream"
          git -C "$workdir/upstream" checkout "$UPSTREAM_COMMIT"

          # Import code + redistributable/open assets. Proprietary OpenFront assets
          # are intentionally excluded from this independent fork.
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='/proprietary/' \
            --exclude='/.github/workflows/import-openfront.yml' \
            --exclude='/BOOTSTRAP_OPENFRONT' \
            "$workdir/upstream/" ./

          rm -rf proprietary
          printf '%s\n' "$UPSTREAM_COMMIT" > .territory-chaos-imported

          git config user.name "territory-chaos-bot"
          git config user.email "territory-chaos-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to import."
            exit 0
          fi
          git commit -m "chore: import verified OpenFront baseline without proprietary assets"
          git push origin HEAD:${GITHUB_REF_NAME}
