name: Import OpenFront Ultra baseline

on:
  workflow_dispatch:
  push:
    paths:
      - BOOTSTRAP_OPENFRONT
      - .github/workflows/import-openfront.yml
      - scripts/applyOpenFrontUltraOverlay.mjs
      - src/client/ultra/**
      - tests/ultra/**

permissions:
  contents: write

concurrency:
  group: openfront-ultra-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'hexonnfr-ops/test'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import verified OpenFront upstream
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM_COMMIT="dc8f3b435cac11582088ce0fa3612444ff627485"
          workdir="$(mktemp -d)"
          git clone --no-tags https://github.com/openfrontio/OpenFrontIO.git "$workdir/upstream"
          git -C "$workdir/upstream" checkout "$UPSTREAM_COMMIT"

          # The branch becomes a real OpenFront source tree. Only the remaster
          # overlay/bootstrap files survive the sync. Proprietary upstream
          # assets are deliberately not redistributed.
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='/proprietary/' \
            --exclude='/.github/workflows/import-openfront.yml' \
            --exclude='/BOOTSTRAP_OPENFRONT' \
            --exclude='/ULTRA_PROGRESS.md' \
            --exclude='/src/client/ultra/' \
            --exclude='/tests/ultra/' \
            --exclude='/scripts/applyOpenFrontUltraOverlay.mjs' \
            "$workdir/upstream/" ./

          rm -rf proprietary
          printf '%s\n' "$UPSTREAM_COMMIT" > .openfront-ultra-upstream

      - name: Apply OpenFront Ultra integration
        run: node scripts/applyOpenFrontUltraOverlay.mjs

      - name: Refresh dependency lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run Ultra tests
        run: npx vitest run tests/ultra

      - name: Lint Ultra modules
        run: npx eslint src/client/ultra tests/ultra

      - name: Build real client
        run: npm run build-dev

      - name: Commit imported OpenFront + Ultra remaster foundation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "openfront-ultra-bot"
          git config user.email "openfront-ultra-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "feat(ultra): import OpenFront and wire remaster foundation"
          git push origin HEAD:${GITHUB_REF_NAME}
